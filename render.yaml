services:
  - type: web
    name: enterprise-task-platform
    env: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: FIREBASE_STORAGE_BUCKET
        value: gen-lang-client-0707937978.firebasestorage.app
      - key: SESSION_SECRET
        generateValue: true
      - key: SESSION_INACTIVITY_TIMEOUT_MINUTES
        value: "30"
      - key: PREMIUM_PLAN_CURRENCY
        value: INR
      - key: PREMIUM_PLAN_AMOUNT
        sync: false
      - key: FIREBASE_PROJECT_ID
        value: gen-lang-client-0707937978
      - key: FIRESTORE_DATABASE_ID
        value: ai-studio-subscriptiontask-992983c8-db4b-4b78-98e3-4f6d1adf9bac
      - key: VITE_FIREBASE_PROJECT_ID
        value: gen-lang-client-0707937978
      - key: VITE_FIRESTORE_DATABASE_ID
        value: ai-studio-subscriptiontask-992983c8-db4b-4b78-98e3-4f6d1adf9bac
      - key: VITE_FIREBASE_API_KEY
        value: AIzaSyBoXlBfQ5qwWxqt7vBtSjP04D3PAM0Kon0
      - key: VITE_FIREBASE_APP_ID
        value: 1:759056051727:web:22b5ac72acb18b5a43fd7a
      - key: VITE_FIREBASE_AUTH_DOMAIN
        value: gen-lang-client-0707937978.firebaseapp.com
      - key: VITE_FIREBASE_VAPID_KEY
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: OAUTH_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: BOOTSTRAP_SETUP_SECRET
        sync: false
